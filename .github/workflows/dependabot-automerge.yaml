name: Dependabot automerge

on:
  push:
    branches: ['dependabot/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_url=''
          for _ in {1..6}; do
            pr_url=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json url --jq '.[0].url // empty')
            if [[ -n "${pr_url}" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "${pr_url}" ]]; then
            echo "::notice::No open PR found for ${GITHUB_REF_NAME}"
            exit 0
          fi

          gh pr merge --auto --merge "${pr_url}" \
            && echo "Auto-merge enabled for ${pr_url}" \
            || echo '::notice::Could not enable auto-merge'
